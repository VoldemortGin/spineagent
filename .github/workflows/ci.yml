# spineagent CI —— push + PR 上跑 格式 + lint + 类型检查 + 测试,Python 多版本矩阵。
#
# spineagent 依赖兄弟薄核 corespine,corespine 已发布到 PyPI(pyproject dependencies 写
# corespine>=0.1.1),故 CI 直接从 PyPI 解析安装 —— 无需再并排签出 corespine 复刻本地家族布局。
#
# 本地开发仍可经 pyproject 的 [tool.uv.sources] path source 把 corespine 指向 ../corespine 做
# 可编辑联调(`make install` 即走此路径);CI 用 `uv pip install --no-sources` 忽略该 path source、
# 强制从 PyPI 装 corespine(与家族 ragspine 从 PyPI 装 corespine 的模型一致)。之后用 Makefile
# 跑与本地同一套四道门。
name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: lint + typecheck + test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout spineagent
        uses: actions/checkout@v4

      - name: Set up uv (+ Python ${{ matrix.python }})
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      # 建 venv 并可编辑安装 spineagent[dev];corespine 从 PyPI 解析(--no-sources 忽略
      # pyproject 里指向 ../corespine 的本地 path source,该 source 只服务本地开发)。
      - name: Install (spineagent[dev]; corespine from PyPI)
        run: |
          uv venv --clear .venv
          VIRTUAL_ENV="$(pwd)/.venv" uv pip install --no-sources -e ".[dev]"

      # 四道门各自独立成步,失败时一眼看出是 格式 / lint / 类型 / 测试哪一关红(对称 corespine CI)。
      - name: Format check (ruff format --check)
        run: make fmt-check

      - name: Lint (ruff)
        run: make lint

      - name: Typecheck (mypy --strict)
        run: make typecheck

      - name: Test (pytest)
        run: make test
